name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
          distribution: 'temurin'
          java-version: '17'

    - name: Install Gradle 7.5
      run: |
        wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
        unzip -q gradle-7.5-bin.zip
        echo "$PWD/gradle-7.5/bin" >> $GITHUB_PATH

    - name: Generate Project & Build APK
      run: |
        # 設定 Android SDK 路徑
        export ANDROID_HOME=/usr/local/lib/android/sdk
        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # 完整寫入所有 Android SDK 官方授權碼
        mkdir -p $ANDROID_HOME/licenses
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb139a648b0" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "24333f1a4ab60c576f85252b472e38c95213b33e" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "209931210452fcf15ff72d0b005118eb3009a258" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "504667d4c0d7af102bf2c16c5929497e171f28b9" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "e9acab5b5f2530622ccee4d31e457f4951b73f8b" >> $ANDROID_HOME/licenses/android-sdk-license

        # 安全安裝編譯工具並自動接受授權
        yes | head -n 40 | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-33" "build-tools;33.0.2" || true

        # 自動建立專案資料夾與檔案
        mkdir -p app/src/main/java/com/leica/watermark
        mkdir -p app/src/main/res/layout

        # 1. 根目錄 settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Leica Watermark"
        include(':app')
        EOF

        # 2. 根目錄 build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '7.4.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.8.0' apply false
        }
        EOF

        # 3. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.leica.watermark'
            compileSdk 33

            defaultConfig {
                applicationId "com.leica.watermark"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
            kotlinOptions {
                jvmTarget = '11'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.8.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="Leica Watermark"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/leica/watermark/MainActivity.kt
        package com.leica.watermark

        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
            }
        }
        EOF

        # 6. 介面 XML (徠卡黑紅風格)
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#121212"
            android:orientation="vertical"
            android:gravity="center"
            android:padding="24dp">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="LEICA WATERMARK"
                android:textColor="#E30613"
                android:textSize="22sp"
                android:textStyle="bold" />

        </LinearLayout>
        EOF

        # 帶有 stacktrace 的編譯指令，以便查看完整錯誤
        gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
