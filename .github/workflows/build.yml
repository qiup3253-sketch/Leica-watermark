name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 7.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip
          echo "$PWD/gradle-7.5/bin" >> $GITHUB_PATH

      - name: Generate Project & Build APK
        run: |
          # 設定 Android SDK 路徑
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 完整寫入所有 Android SDK 官方授權碼
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb139a648b0" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f1a4ab60c576f85252b472e38c95213b33e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "209931210452fcf15ff72d0b005118eb3009a258" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "504667d4c0d7af102bf2c16c5929497e171f28b9" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "e9acab5b5f2530622ccee4d31e457f4951b73f8b" >> $ANDROID_HOME/licenses/android-sdk-license

          # 安全安裝編譯工具並自動接受授權
          yes | head -n 40 | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-33" "build-tools;33.0.2" || true

          # 自動建立專案資料夾結構
          mkdir -p app/src/main/java/com/leica/watermark
          mkdir -p gradle/wrapper

          # 1. 根目錄 settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Leica Watermark"
          include(':app')
          EOF

          # 2. 根目錄 build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 4. gradle-wrapper.properties
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 5. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.leica.watermark'
              compileSdk 33

              defaultConfig {
                  applicationId "com.leica.watermark"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }

          dependencies {
          }
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:label="Leica Watermark"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. MainActivity.java (以寬度為基準計算浮水印，杜絕直式相片排版崩潰)
          cat << 'EOF' > app/src/main/java/com/leica/watermark/MainActivity.java
          package com.leica.watermark;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.Toast;

          import java.io.InputStream;

          public class MainActivity extends Activity {
              private static final int PICK_IMAGE = 1;
              private ImageView imageView;
              private Bitmap selectedBitmap;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setBackgroundColor(Color.parseColor("#121212"));
                  layout.setPadding(30, 30, 30, 30);

                  imageView = new ImageView(this);
                  LinearLayout.LayoutParams imageParams = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 800
                  );
                  imageView.setLayoutParams(imageParams);
                  imageView.setBackgroundColor(Color.parseColor("#1e1e1e"));
                  layout.addView(imageView);

                  Button selectBtn = new Button(this);
                  selectBtn.setText("選擇相片");
                  selectBtn.setBackgroundColor(Color.parseColor("#E30613"));
                  selectBtn.setTextColor(Color.WHITE);
                  selectBtn.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI);
                      startActivityForResult(intent, PICK_IMAGE);
                  });
                  LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  btnParams.setMargins(0, 30, 0, 20);
                  selectBtn.setLayoutParams(btnParams);
                  layout.addView(selectBtn);

                  Button watermarkBtn = new Button(this);
                  watermarkBtn.setText("套用經典徠卡浮水印並儲存");
                  watermarkBtn.setBackgroundColor(Color.parseColor("#333333"));
                  watermarkBtn.setTextColor(Color.WHITE);
                  watermarkBtn.setOnClickListener(v -> {
                      if (selectedBitmap != null) {
                          Bitmap watermarked = addLeicaWatermark(selectedBitmap);
                          imageView.setImageBitmap(watermarked);
                          saveImageToGallery(watermarked);
                          Toast.makeText(this, "浮水印已製作並儲存至相簿！", Toast.LENGTH_SHORT).show();
                      } else {
                          Toast.makeText(this, "請先選擇一張相片！", Toast.LENGTH_SHORT).show();
                      }
                  });
                  watermarkBtn.setLayoutParams(btnParams);
                  layout.addView(watermarkBtn);

                  setContentView(layout);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PICK_IMAGE && resultCode == RESULT_OK && data != null) {
                      Uri imageUri = data.getData();
                      try {
                          InputStream imageStream = getContentResolver().openInputStream(imageUri);
                          selectedBitmap = BitmapFactory.decodeStream(imageStream);
                          imageView.setImageBitmap(selectedBitmap);
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }
              }

              private Bitmap addLeicaWatermark(Bitmap src) {
                  int w = src.getWidth();
                  int h = src.getHeight();
                  
                  // 關鍵修復：改以圖片寬度 w 計算浮水印高度，避免直式相片高度過大導致排版崩潰
                  int watermarkHeight = Math.max(140, w / 8);

                  Bitmap.Config config = src.getConfig() != null ? src.getConfig() : Bitmap.Config.ARGB_8888;
                  Bitmap result = Bitmap.createBitmap(w, h + watermarkHeight, config);
                  Canvas canvas = new Canvas(result);
                  canvas.drawBitmap(src, 0, 0, null);

                  // 1. 畫白色質感底框
                  Paint bgPaint = new Paint();
                  bgPaint.setColor(Color.WHITE);
                  canvas.drawRect(0, h, w, h + watermarkHeight, bgPaint);

                  // 2. 左側文字區塊（安全字體大小）
                  Paint textPaintDark = new Paint();
                  textPaintDark.setColor(Color.parseColor("#121212"));
                  textPaintDark.setTextSize(watermarkHeight * 0.22f);
                  textPaintDark.setFakeBoldText(true);
                  textPaintDark.setAntiAlias(true);

                  Paint textPaintGray = new Paint();
                  textPaintGray.setColor(Color.parseColor("#666666"));
                  textPaintGray.setTextSize(watermarkHeight * 0.16f);
                  textPaintGray.setAntiAlias(true);

                  float leftMargin = w * 0.04f;
                  canvas.drawText("LEICA M11", leftMargin, h + watermarkHeight * 0.40f, textPaintDark);
                  canvas.drawText("SUMMILUX-M f/1.4", leftMargin, h + watermarkHeight * 0.74f, textPaintGray);

                  // 3. 正中間經典紅色 Leica 圓標（嚴格置中）
                  float logoWidth = watermarkHeight * 1.25f;
                  float logoHeight = watermarkHeight * 0.52f;
                  float logoLeft = (w - logoWidth) / 2f;
                  float logoTop = h + (watermarkHeight - logoHeight) / 2f;

                  Paint redPaint = new Paint();
                  redPaint.setColor(Color.parseColor("#E30613"));
                  redPaint.setAntiAlias(true);
                  RectF logoRect = new RectF(logoLeft, logoTop, logoLeft + logoWidth, logoTop + logoHeight);
                  canvas.drawRoundRect(logoRect, logoHeight / 2f, logoHeight / 2f, redPaint);

                  Paint logoTextPaint = new Paint();
                  logoTextPaint.setColor(Color.WHITE);
                  logoTextPaint.setTextSize(logoHeight * 0.5f);
                  logoTextPaint.setFakeBoldText(true);
                  logoTextPaint.setAntiAlias(true);
                  logoTextPaint.setTextAlign(Paint.Align.CENTER);
                  
                  Paint.FontMetrics fm = logoTextPaint.getFontMetrics();
                  float textY = logoTop + (logoHeight - (fm.descent - fm.ascent)) / 2f - fm.ascent;
                  canvas.drawText("Leica", logoLeft + logoWidth / 2f, textY, logoTextPaint);

                  // 4. 右側參數與座標區塊（靠右對齊）
                  Paint textPaintRight = new Paint();
                  textPaintRight.setColor(Color.parseColor("#121212"));
                  textPaintRight.setTextSize(watermarkHeight * 0.22f);
                  textPaintRight.setFakeBoldText(true);
                  textPaintRight.setAntiAlias(true);
                  textPaintRight.setTextAlign(Paint.Align.RIGHT);

                  Paint textPaintRightGray = new Paint();
                  textPaintRightGray.setColor(Color.parseColor("#666666"));
                  textPaintRightGray.setTextSize(watermarkHeight * 0.16f);
                  textPaintRightGray.setAntiAlias(true);
                  textPaintRightGray.setTextAlign(Paint.Align.RIGHT);

                  float rightMargin = w - w * 0.04f;
                  canvas.drawText("1/125s ISO 100", rightMargin, h + watermarkHeight * 0.40f, textPaintRight);
                  canvas.drawText("25°02'N 121°37'E", rightMargin, h + watermarkHeight * 0.74f, textPaintRightGray);

                  return result;
              }

              private void saveImageToGallery(Bitmap bitmap) {
                  try {
                      MediaStore.Images.Media.insertImage(getContentResolver(), bitmap, "LeicaWatermark_" + System.currentTimeMillis(), "Leica Watermark Image");
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

          # 產生 Wrapper 並開始編譯
          gradle wrapper --gradle-version 7.5 --distribution-type bin
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
